name: quran_learning_core
description: Core logic & early Flutter scaffold for Quran & Arabic learning app
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0
  collection: ^1.18.0
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.2.0
  firebase_crashlytics: ^3.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  lints: ^3.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
