name: quran_learning_core
description: Core logic & early Flutter scaffold for Quran & Arabic learning app
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1
  # (Removed freezed/json_annotation for now to simplify early scaffold)
  intl: ^0.19.0
  collection: ^1.18.0
  # Firebase packages aligned to core 3.x & auth 5.x series
  firebase_core: ^3.8.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.6.10
  firebase_storage: ^12.3.0
  firebase_crashlytics: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # build_runner & codegen deps removed in early phase
  lints: ^3.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  # assets: (temporarily disabled until directories created)
  #   - assets/audio/
  #   - assets/images/
